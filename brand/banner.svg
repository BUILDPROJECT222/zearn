<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <radialGradient id="glowR" cx="82%" cy="10%" r="60%">
      <stop offset="0" stop-color="#f4b728" stop-opacity="0.22" />
      <stop offset="1" stop-color="#f4b728" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowL" cx="8%" cy="30%" r="45%">
      <stop offset="0" stop-color="#6ea8fe" stop-opacity="0.10" />
      <stop offset="1" stop-color="#6ea8fe" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0" />
      <stop offset="1" stop-color="#08080b" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a" />
      <stop offset="1" stop-color="#f4b728" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f4b728" />
    </marker>
  </defs>

  <rect width="1500" height="500" fill="#08080b" />
  <rect width="1500" height="500" fill="url(#grid)" />
  <rect width="1500" height="500" fill="url(#glowR)" />
  <rect width="1500" height="500" fill="url(#glowL)" />
  <rect y="330" width="1500" height="170" fill="url(#fade)" />

  <!-- left: message (kept above y=320, the avatar covers the bottom-left) -->
  <text x="80" y="96" font-family="Consolas" font-size="19" letter-spacing="4" fill="#f4b728">PUMP.FUN  ×  NEAR INTENTS  ×  ZCASH</text>
  <text x="76" y="182" font-family="Segoe UI" font-weight="900" font-size="80" letter-spacing="-2" fill="#f2efe6">Hold to zearn.</text>
  <text x="76" y="266" font-family="Segoe UI" font-weight="900" font-size="80" letter-spacing="-2" fill="url(#gold)" filter="url(#glow)">The floor holds.</text>
  <text x="80" y="312" font-family="Segoe UI" font-size="24" fill="#a4a4b4">Every trade stacks ZEC in a public vault. Burn to redeem, hold to unlock.</text>

  <!-- right: the machine -->
  <g font-family="Consolas" text-anchor="middle">
    <!-- row 1 -->
    <rect x="1040" y="62" width="170" height="64" rx="12" fill="#111117" stroke="#34343f" />
    <text x="1125" y="91" font-size="16" fill="#f2efe6" font-weight="700">TRADES</text>
    <text x="1125" y="113" font-size="13" fill="#a4a4b4">creator fees</text>
    <rect x="1250" y="62" width="170" height="64" rx="12" fill="#111117" stroke="#6ea8fe" stroke-width="1.6" />
    <text x="1335" y="91" font-size="16" fill="#6ea8fe" font-weight="700">NEAR INTENTS</text>
    <text x="1335" y="113" font-size="13" fill="#a4a4b4">SOL → ZEC</text>
    <path d="M1212 94 H1246" stroke="#f4b728" stroke-width="2" marker-end="url(#arr)" />

    <!-- vault -->
    <path d="M1335 128 V160" stroke="#f4b728" stroke-width="2" marker-end="url(#arr)" />
    <rect x="1150" y="164" width="270" height="70" rx="14" fill="#15130c" stroke="#f4b728" stroke-width="2" />
    <text x="1285" y="195" font-size="18" fill="#f4b728" font-weight="700">ZEC VAULT</text>
    <text x="1285" y="219" font-size="13" fill="#a4a4b4">public · intents.near</text>

    <!-- split -->
    <path d="M1230 236 V266" stroke="#f4b728" stroke-width="2" marker-end="url(#arr)" />
    <path d="M1340 236 V266" stroke="#3ee38a" stroke-width="2" marker-end="url(#arr)" />
    <rect x="1150" y="270" width="130" height="66" rx="12" fill="#111117" stroke="#f4b728" stroke-width="1.6" />
    <text x="1215" y="298" font-size="15" fill="#f4b728" font-weight="700">FLOOR 50%</text>
    <text x="1215" y="319" font-size="12" fill="#a4a4b4">burn → ZEC</text>
    <rect x="1290" y="270" width="130" height="66" rx="12" fill="#111117" stroke="#3ee38a" stroke-width="1.6" />
    <text x="1355" y="298" font-size="15" fill="#3ee38a" font-weight="700">HOLD 50%</text>
    <text x="1355" y="319" font-size="12" fill="#a4a4b4">hold → unlock</text>

    <!-- coins riding the flow -->
    <circle cx="1229" cy="94" r="5" fill="#6ea8fe" />
    <circle cx="1335" cy="146" r="5" fill="#f4b728" />
  </g>

  <!-- floor line + ticker, bottom right (clear of the avatar) -->
  <rect x="1150" y="372" width="270" height="6" rx="3" fill="#ffd76a" filter="url(#glow)" />
  <text x="1420" y="430" font-family="Segoe UI" font-weight="900" font-size="40" letter-spacing="-1" text-anchor="end" fill="#f2efe6">$ZEARN</text>
  <text x="1420" y="458" font-family="Consolas" font-size="15" letter-spacing="2" text-anchor="end" fill="#6b6b7c">ZEC-BACKED · NO APY · NO PROMISES</text>
</svg>
